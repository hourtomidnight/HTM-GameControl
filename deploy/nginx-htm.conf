# HTM Room Control — nginx include block
# This is NOT a full server block. It is designed to be included inside
# your existing server {} block, or dropped into /etc/nginx/sites-available/
# as a standalone file if HTM is the only site on this Pi.
#
# OPTION A — add to your existing site:
#   Place this file at /etc/nginx/snippets/htm-room-control.conf
#   then inside your existing server {} block add:
#       include /etc/nginx/snippets/htm-room-control.conf;
#
# OPTION B — standalone (only use if no other site runs on port 80):
#   Place at /etc/nginx/sites-available/htm-room-control
#   and wrap in:
#       server { listen 80; server_name hourtomidnight hourtomidnight.local _; include /etc/nginx/snippets/htm-room-control.conf; }

    # ── /room-control redirect ────────────────────────────────────────────────
    location = /room-control {
        return 302 /room-control/;
    }

    # ── /room-control/ landing page ───────────────────────────────────────────
    location = /room-control/ {
        proxy_pass         http://127.0.0.1:4000/index.html;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
    }

    # ── App pages (operator, game, config) ────────────────────────────────────
    location ~ ^/(operator|game|config)\.html$ {
        proxy_pass         http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
    }

    # ── Static JS files served by the node server ─────────────────────────────
    location ~ ^/(channel|game|operator)\.js$ {
        proxy_pass         http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
    }

    # ── Assets (audio, images) ────────────────────────────────────────────────
    location /assets/ {
        proxy_pass         http://127.0.0.1:4000/assets/;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
    }

    # ── SSE — buffering must be off or the event stream stalls ───────────────
    location = /events {
        proxy_pass             http://127.0.0.1:4000/events;
        proxy_http_version     1.1;
        proxy_set_header       Host $host;
        proxy_set_header       X-Real-IP $remote_addr;
        proxy_buffering        off;
        proxy_cache            off;
        proxy_read_timeout     86400s;
        proxy_send_timeout     86400s;
        chunked_transfer_encoding on;
        add_header             X-Accel-Buffering no;
    }

    # ── API: command relay + config storage ───────────────────────────────────
    location ~ ^/(cmd|config)$ {
        proxy_pass         http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
    }

    # ── M1 event/signal API (/api/events, /api/signals, /api/games, …) ────────
    location ~ ^/api/ {
        proxy_pass         http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
    }

    # ── Health check ─────────────────────────────────────────────────────────
    location = /healthz {
        proxy_pass         http://127.0.0.1:4000/healthz;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
    }
