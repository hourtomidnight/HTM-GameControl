<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>HTM — Operator</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0d0d1a;
      color: #e0e0e0;
      font-family: Arial, sans-serif;
      font-size: 13px;
      height: 100vh;
      display: grid;
      grid-template-rows: auto 1fr var(--notes-h, 150px);
      grid-template-columns: var(--left-w, 300px) 6px 1fr;
      grid-template-areas:
        "timer timer   timer"
        "ctrl  divider hints"
        "notes notes   notes";
      overflow: hidden;
    }

    /* Grid children must be allowed to shrink so the tracks honor their sizes */
    #ctrl-panel, #hints-panel { min-width: 0; }

    /* ── Bottom notes panel (drag its top edge to resize) ── */
    #notes-panel {
      grid-area: notes;
      display: flex; flex-direction: column;
      background: #0f0f22;
      border-top: 2px solid #1e1e4a;
      min-height: 0;
    }
    #notes-drag {
      height: 10px; flex: none; cursor: row-resize;
      background: #16163a;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.12s;
    }
    #notes-drag::before {
      content: ''; width: 48px; height: 3px; border-radius: 2px; background: #45457a;
    }
    #notes-drag:hover, #notes-drag.dragging { background: #3535aa; }
    #notes-panel .notes-hdr {
      font-size: 10px; color: #667; text-transform: uppercase;
      letter-spacing: 2px; padding: 6px 14px 0;
    }
    #notes-input {
      flex: 1; margin: 5px 12px 12px; resize: none; min-height: 0;
      background: #0f3460; border: 1px solid #1a4a80; color: #fff;
      border-radius: 6px; padding: 8px 11px; font-size: 14px; line-height: 1.45;
      font-family: Arial, sans-serif;
    }
    body.row-resizing { cursor: row-resize; user-select: none; }

    /* Draggable column divider */
    #col-divider {
      grid-area: divider;
      background: #1e1e4a;
      cursor: col-resize;
      transition: background 0.12s;
    }
    #col-divider:hover, #col-divider.dragging { background: #3535aa; }
    body.col-resizing { cursor: col-resize; user-select: none; }

    /* ── Top timer bar ── */
    #timer-panel {
      grid-area: timer;
      background: #12122a;
      border-bottom: 2px solid #1e1e4a;
      display: flex;
      align-items: center;
      gap: 20px;
      padding: 10px 20px;
      flex-wrap: wrap;
    }

    #timer-block { min-width: 220px; }

    #big-timer {
      font-size: 72px;
      font-weight: bold;
      font-family: Arial, sans-serif;
      color: #fff;
      letter-spacing: -2px;
      line-height: 1;
    }
    #big-timer.negative { color: #ff4444; }
    #big-timer.running  { color: #7fff7f; }
    #big-timer.paused   { color: #fff; }
    #big-timer.escaped  { color: #ffd700; }

    #status-badge {
      font-size: 11px; letter-spacing: 3px;
      text-transform: uppercase; color: #555; margin-top: 3px;
    }

    /* adjust clusters */
    .adj-cluster { display: flex; flex-direction: column; align-items: center; gap: 4px; }
    .adj-cluster label { font-size: 10px; color: #555; letter-spacing: 1px; text-transform: uppercase; }
    .adj-row { display: flex; gap: 5px; }

    button {
      border: none; border-radius: 7px; cursor: pointer;
      font-weight: bold; transition: filter 0.12s, transform 0.1s;
      user-select: none;
    }
    button:hover  { filter: brightness(1.18); }
    button:active { transform: scale(0.95); }
    button:disabled { opacity: 0.3; cursor: not-allowed; filter: none; transform: none; }

    .btn-adj  { width: 46px; height: 36px; font-size: 18px; background: #1e2a4a; color: #a0c4ff; }
    .btn-main { padding: 9px 18px; font-size: 13px; font-weight: bold; }
    .btn-start   { background: #2e7d32; color: #fff; }
    .btn-pause   { background: #1565c0; color: #fff; }
    .btn-escaped { background: #7b1fa2; color: #fff; }
    .btn-reset   { background: #37474f; color: #ccc; }
    .btn-cfg     { background: #263238; color: #90caf9; font-size: 11px; padding: 6px 12px; }

    #main-btns { display: flex; flex-direction: column; gap: 7px; }
    #main-btns .row { display: flex; gap: 7px; }

    /* ── Left column ── */
    #ctrl-panel {
      grid-area: ctrl;
      background: #0f0f22;
      border-right: 2px solid #1e1e4a;
      padding: 14px 12px;
      display: flex; flex-direction: column; gap: 14px;
      overflow-y: auto;
    }

    .ctrl-section h3 {
      font-size: 10px; color: #444; text-transform: uppercase;
      letter-spacing: 2px; margin-bottom: 9px;
      border-bottom: 1px solid #1e1e4a; padding-bottom: 5px;
    }

    .vol-row { display: flex; align-items: center; gap: 7px; }
    .btn-vol { width: 36px; height: 32px; font-size: 16px; background: #1a2a3a; color: #a0c4ff; }
    #vol-display { font-size: 16px; font-weight: bold; color: #a0c4ff; min-width: 42px; text-align: center; }

    #clue-count-display { font-size: 36px; font-weight: bold; color: #ffd700; text-align: center; }
    #clue-count-label   { font-size: 10px; color: #444; text-align: center; letter-spacing: 1px; }

    .btn-hide-clue {
      width: 100%; padding: 8px; background: #2a1515; color: #ff8888;
      font-size: 11px; margin-top: 4px; border-radius: 7px;
    }

    /* ── Right: hints panel ── */
    #hints-panel {
      grid-area: hints;
      padding: 12px 14px;
      overflow-y: auto;
      background: #0d0d1a;
    }

    #hints-panel > .panel-hdr {
      font-size: 10px; color: #444; text-transform: uppercase;
      letter-spacing: 2px; margin-bottom: 10px;
      border-bottom: 1px solid #1e1e4a; padding-bottom: 5px;
    }

    /* Individual hint buttons (still used by board.js's renderHintPad) */
    .hint-btn {
      display: flex; align-items: center; gap: 8px;
      background: #131330; border: 1px solid #1e1e4a;
      border-radius: 7px; padding: 8px 12px;
      text-align: left; width: 100%; color: #e0e0e0;
      cursor: pointer; transition: background 0.12s, border-color 0.12s;
    }
    .hint-btn:hover  { background: #1c1c50; border-color: #3535aa; }
    .hint-btn:active { background: #252580; }
    .hint-btn.flash  { background: #2a2a80; }

    .hint-key-badge {
      background: #0f3460; color: #a0c4ff;
      font-family: monospace; font-size: 10px;
      padding: 2px 7px; border-radius: 4px;
      min-width: 56px; text-align: center;
      flex-shrink: 0; white-space: nowrap;
    }
    .hint-key-badge.no-key { background: #111; color: #333; }

    .hint-text { font-size: 13px; line-height: 1.3; flex: 1; }

    #no-hints-msg { color: #334; font-size: 13px; text-align: center; margin-top: 30px; }

    /* ── Progress board ── */
    .board-section { margin-bottom: 14px; }

    .board-section-hdr {
      font-size: 11px; font-weight: bold; color: #7fb8ff;
      text-transform: uppercase; letter-spacing: 1px;
      padding: 5px 8px;
      background: #131335;
      border-radius: 6px 6px 0 0;
      border-bottom: 1px solid #1e2a5a;
      cursor: pointer;
      display: flex; align-items: center; justify-content: space-between;
    }
    .board-section-hdr:hover { background: #181848; }

    .board-section-body { display: flex; flex-direction: column; gap: 8px; padding-top: 5px; }
    .board-section.collapsed .board-section-body { display: none; }

    .board-step {
      background: #10102a; border: 1px solid #1e1e4a; border-radius: 7px;
      padding: 6px 8px;
    }
    .board-step-hdr {
      font-size: 12px; font-weight: bold; color: #cdd;
      display: flex; align-items: center; justify-content: space-between;
      cursor: pointer; padding: 3px 2px;
    }
    .board-step-body { display: flex; flex-direction: column; gap: 5px; padding-top: 5px; }
    .board-step.collapsed .board-step-body { display: none; }

    .btn-solve {
      background: #0f3460; color: #a0c4ff; font-size: 10px;
      padding: 4px 9px; border-radius: 5px;
    }

    .board-flags { display: flex; flex-direction: column; gap: 6px; margin-top: 10px; }
    .board-flag { display: flex; align-items: center; gap: 7px; font-size: 12px; color: #ccc; cursor: pointer; }

    /* ── Active hints ── */
    #active-hints-list { display: flex; flex-direction: column; gap: 5px; }
    .active-hint-row {
      display: flex; align-items: flex-start; gap: 6px;
      background: #0f2a1a; border: 1px solid #1e5a30;
      border-radius: 7px; padding: 7px 10px;
    }
    .active-hint-text { flex: 1; font-size: 12px; color: #aaffbb; line-height: 1.3; word-break: break-word; }
    .btn-dismiss-hint {
      background: #3a1515; color: #ff8888; border: none; border-radius: 5px;
      padding: 2px 7px; font-size: 11px; cursor: pointer; flex-shrink: 0;
      font-weight: bold; line-height: 1.6;
    }
    .btn-dismiss-hint:hover { background: #5a2020; }
    #no-active-hints { color: #334; font-size: 12px; text-align: center; padding: 6px 0; }

    .btn-reopen-game {
      width: 100%; padding: 6px; background: #1a2a3a; color: #7fb8ff;
      font-size: 11px; border-radius: 7px; margin-top: 4px;
    }

    /* ── Session Info card ── */
    .card {
      background: #16213e;
      border-radius: 10px;
      padding: 14px 16px;
      margin-bottom: 4px;
    }
    .card h2 {
      font-size: 11px; color: #a0c4ff; text-transform: uppercase;
      letter-spacing: 2px; margin-bottom: 10px;
      border-bottom: 1px solid #0f3460; padding-bottom: 6px;
    }
    .field-row {
      display: flex; align-items: center; gap: 8px; margin-bottom: 8px;
    }
    .field-row label { width: 96px; color: #aaa; flex-shrink: 0; font-size: 11px; }
    .field-row input[type="text"],
    .field-row input[type="number"],
    .field-row select,
    .field-row textarea {
      background: #0f3460; border: 1px solid #1a4a80;
      color: #fff; border-radius: 6px; padding: 5px 9px; font-size: 12px;
      min-width: 0;
    }
    .field-row input[type="text"],
    .field-row select { flex: 1; }
    .card { min-width: 0; }
  </style>
</head>
<body>

<!-- Timer bar -->
<div id="timer-panel">
  <div id="timer-block">
    <div id="big-timer">60:00</div>
    <div id="status-badge">WAITING</div>
  </div>

  <div class="adj-cluster">
    <label>Minute</label>
    <div class="adj-row">
      <button class="btn-adj" id="add-min">+</button>
      <button class="btn-adj" id="sub-min">−</button>
    </div>
  </div>

  <div class="adj-cluster">
    <label>Second</label>
    <div class="adj-row">
      <button class="btn-adj" id="add-sec">+</button>
      <button class="btn-adj" id="sub-sec">−</button>
    </div>
  </div>

  <div id="main-btns">
    <div class="row">
      <button class="btn-main btn-start"   id="btn-start">▶ Start</button>
      <button class="btn-main btn-pause"   id="btn-pause">⏸ Pause</button>
    </div>
    <div class="row">
      <button class="btn-main btn-escaped" id="btn-escaped">🏁 Escaped</button>
      <button class="btn-main btn-reset"   id="btn-reset">↺ Reset</button>
    </div>
  </div>

  <button class="btn-cfg" id="btn-stop-audio" style="margin-left:auto;align-self:flex-start;">🔇 Stop Audio</button>
  <button class="btn-cfg" id="btn-media" style="align-self:flex-start;">🎵 Media</button>
  <button class="btn-cfg" id="btn-cfg" style="align-self:flex-start;">⚙ Config</button>
</div>

<!-- Left controls -->
<div id="ctrl-panel">
  <div class="card" id="session-info-card">
    <h2>Session Info</h2>
    <div class="field-row">
      <label>Team name</label>
      <input type="text" id="team-name-input" placeholder="Team name" />
    </div>
    <div class="field-row">
      <label>Operator</label>
      <select id="operator-select"><option value="">— select —</option></select>
    </div>
    <div class="field-row">
      <label>New players</label>
      <input type="number" id="new-players-input" min="0" value="0" style="width:60px;" />
    </div>
    <div class="field-row">
      <label>Experienced players</label>
      <input type="number" id="experienced-players-input" min="0" value="0" style="width:60px;" />
    </div>
  </div>

  <div class="ctrl-section">
    <h3>Volume</h3>
    <div class="vol-row">
      <button class="btn-vol" id="vol-down">−</button>
      <div id="vol-display">40%</div>
      <button class="btn-vol" id="vol-up">+</button>
    </div>
  </div>

  <div class="ctrl-section">
    <h3>Hints Given</h3>
    <div id="clue-count-display">0</div>
    <div id="clue-count-label">USED</div>
  </div>

  <div class="ctrl-section">
    <h3>Active on Screen</h3>
    <div id="active-hints-list">
      <div id="no-active-hints">None</div>
    </div>
    <button class="btn-hide-clue" id="btn-hide-clue" style="margin-top:8px;">✕ Dismiss All</button>
  </div>

  <div class="ctrl-section">
    <h3>Game Screen</h3>
    <button class="btn-reopen-game" id="btn-reopen-game">↗ Reopen Game Window</button>
  </div>
</div>

<!-- Draggable column divider -->
<div id="col-divider" title="Drag to resize"></div>

<!-- Hints panel -->
<div id="hints-panel">
  <div class="panel-hdr">Progress Board</div>
  <div id="board-root">
    <div id="no-hints-msg">No hints configured. Open ⚙ Config to add hint groups.</div>
  </div>
</div>

<!-- Bottom notes panel -->
<div id="notes-panel">
  <div id="notes-drag" title="Drag to resize · double-click to reset"></div>
  <div class="notes-hdr">Notes</div>
  <textarea id="notes-input" placeholder="Session notes…"></textarea>
</div>

<script>
  // Draggable left/right column split, persisted per browser.
  (function () {
    var KEY = 'htm-op-left-w', MIN = 220, MAX = 640;
    var divider = document.getElementById('col-divider');
    function setW(px) {
      px = Math.max(MIN, Math.min(MAX, px));
      document.body.style.setProperty('--left-w', px + 'px');
      return px;
    }
    try { var saved = parseInt(localStorage.getItem(KEY), 10); if (saved) setW(saved); } catch (e) {}
    var dragging = false;
    divider.addEventListener('pointerdown', function (e) {
      dragging = true;
      divider.classList.add('dragging');
      document.body.classList.add('col-resizing');
      divider.setPointerCapture(e.pointerId);
      e.preventDefault();
    });
    divider.addEventListener('pointermove', function (e) {
      if (!dragging) return;
      setW(e.clientX);
    });
    function end(e) {
      if (!dragging) return;
      dragging = false;
      divider.classList.remove('dragging');
      document.body.classList.remove('col-resizing');
      var w = parseInt(getComputedStyle(document.body).getPropertyValue('--left-w'), 10);
      try { if (w) localStorage.setItem(KEY, String(w)); } catch (e2) {}
    }
    divider.addEventListener('pointerup', end);
    divider.addEventListener('pointercancel', end);
    divider.addEventListener('dblclick', function () {
      document.body.style.removeProperty('--left-w');
      try { localStorage.removeItem(KEY); } catch (e) {}
    });
  })();

  // Draggable bottom notes panel height, persisted per browser.
  (function () {
    var KEY = 'htm-op-notes-h', MIN = 46;
    var handle = document.getElementById('notes-drag');
    function maxH() { return Math.round(window.innerHeight * 0.72); }
    function setH(px) {
      px = Math.max(MIN, Math.min(maxH(), px));
      document.body.style.setProperty('--notes-h', px + 'px');
      return px;
    }
    try { var saved = parseInt(localStorage.getItem(KEY), 10); if (saved) setH(saved); } catch (e) {}
    var dragging = false;
    handle.addEventListener('pointerdown', function (e) {
      dragging = true;
      handle.classList.add('dragging');
      document.body.classList.add('row-resizing');
      handle.setPointerCapture(e.pointerId);
      e.preventDefault();
    });
    handle.addEventListener('pointermove', function (e) {
      if (!dragging) return;
      setH(window.innerHeight - e.clientY);
    });
    function end() {
      if (!dragging) return;
      dragging = false;
      handle.classList.remove('dragging');
      document.body.classList.remove('row-resizing');
      var h = parseInt(getComputedStyle(document.body).getPropertyValue('--notes-h'), 10);
      try { if (h) localStorage.setItem(KEY, String(h)); } catch (e) {}
    }
    handle.addEventListener('pointerup', end);
    handle.addEventListener('pointercancel', end);
    handle.addEventListener('dblclick', function () {
      document.body.style.removeProperty('--notes-h');
      try { localStorage.removeItem(KEY); } catch (e) {}
    });
  })();
</script>
<script src="channel.js"></script>
<script src="board.js"></script>
<script src="operator.js"></script>
</body>
</html>
